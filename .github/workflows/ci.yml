name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REPO_URL: https://github.com/${{ github.repository }}
  VPK_VERSION: 1.2.158

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      released: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      # A release is due on a v* tag, or on main when <Version> names a release that does not exist yet:
      # bumping the version in Directory.Build.props is all it takes to ship.
      - name: Release needed?
        id: release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.version.outputs.value }}" --repo $env:GITHUB_REPOSITORY *> $null
          $needed = $LASTEXITCODE -ne 0
          $global:LASTEXITCODE = 0
          "needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release v${{ steps.version.outputs.value }} needed: $needed"

      - name: Test
        env:
          SOFTWAREDOCK_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
        run: dotnet test SoftwareDock.slnx -c Release

      # Self-contained: users need nothing installed but Windows. Dock and MCP server ship side by side.
      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          dotnet publish src/SoftwareDock.App -c Release -r win-x64 --self-contained -p:Version=$v -o artifacts/publish
          dotnet publish src/SoftwareDock.Mcp -c Release -r win-x64 --self-contained -p:Version=$v -o artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: SoftwareDock-win-x64
          path: artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots

      # Releases: Setup.exe, a portable zip and delta packages, which the installed dock reads to update itself.
      - name: Package release
        if: steps.release.outputs.needed == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.version.outputs.value }}'
          dotnet tool install -g vpk --version $env:VPK_VERSION
          # The previous release is the base for delta packages; the first release has none.
          vpk download github --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN -o artifacts/releases
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous release: full package only.'; $global:LASTEXITCODE = 0 }
          vpk pack --packId SoftwareDock --packVersion $v --packDir artifacts/publish --mainExe SoftwareDock.exe `
            --packTitle "Software Dock" --packAuthors "Miguel Molina" `
            --icon src/SoftwareDock.App/Assets/app.ico --shortcuts StartMenuRoot -o artifacts/releases
          vpk upload github --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN -o artifacts/releases `
            --publish --releaseName "Software Dock $v" --tag "v$v" --targetCommitish $env:GITHUB_SHA

  # The new release goes out to the MCP Registry, as an MCP bundle and to WinGet.
  distribute:
    needs: build
    if: needs.build.outputs.released == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/distribute.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
