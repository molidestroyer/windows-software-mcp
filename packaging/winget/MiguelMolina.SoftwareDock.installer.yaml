# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: MiguelMolina.SoftwareDock
PackageVersion: {{VERSION}}
Platform:
- Windows.Desktop
MinimumOSVersion: 10.0.19041.0
# Velopack's Setup.exe: per user, no admin, into %LOCALAPPDATA%\SoftwareDock.
InstallerType: exe
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
UpgradeBehavior: install
# Velopack registers the app under HKCU\...\Uninstall\<packId>.
ProductCode: SoftwareDock
ReleaseDate: {{DATE}}
AppsAndFeaturesEntries:
- DisplayName: Software Dock
  Publisher: Miguel Molina
  ProductCode: SoftwareDock
Installers:
- Architecture: x64
  InstallerUrl: {{URL}}
  InstallerSha256: {{SHA256}}
ManifestType: installer
ManifestVersion: 1.10.0
